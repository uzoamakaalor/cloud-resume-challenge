name: Deploy Cloud Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_WORKING_DIR: infra
  AWS_ROLE_ARN: arn:aws:iam::584094646045:role/cloud-resume-github-actions
  SITE_BUCKET: cloud-resume-site-ruthalorresume.online
  CLOUDFRONT_ID: E1XBLRMYRTPURA

jobs:
  # Single job: one OIDC handshake, then terraform, then frontend.
  # Merging avoids the two-job race condition where each job
  # authenticated separately and one would intermittently fail.
  deploy:
    name: Deploy (Terraform + Frontend)
    runs-on: ubuntu-latest
    environment: production   # manual approval gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Sync frontend to S3
        run: aws s3 sync frontend/ s3://${{ env.SITE_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths "/*"
